<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRi Corp Hub</title>
    <style>
        /* CSS Variables for easy theming */
        :root {
            --bg-color: #f0f5fa; /* Soft blueprint blue-tinted light background */
            --text-main: #0c4a6e;
            --text-muted: #0369a1;
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-hover: rgba(255, 255, 255, 0.95);
            --accent-color: #0284c7;
            --border-color: #bae6fd;
            --font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Base Styles & Blueprint Grid Background */
        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            background-size: 32px 32px;
            background-image: 
                linear-gradient(to right, rgba(2, 132, 199, 0.12) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(2, 132, 199, 0.12) 1px, transparent 1px);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        /* Sections & Links */
        section {
            margin-bottom: 2.5rem;
        }

        h2 {
            font-size: 1.125rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .link-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-card {
            display: flex;
            align-items: center;
            padding: 1rem 1.25rem;
            background-color: var(--card-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 500;
            font-size: 1.05rem;
            box-shadow: 0 1px 3px rgba(2, 132, 199, 0.08);
            transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.2s ease;
        }

        .link-card:hover, .link-card:focus {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.12);
            background-color: var(--card-hover);
        }

        /* Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(12, 74, 110, 0.4);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 16px;
            width: 90%;
            max-width: 450px;
            position: relative;
            box-shadow: 0 20px 25px -5px rgba(2, 132, 199, 0.15);
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .close-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--text-muted);
            cursor: pointer;
            line-height: 1;
        }

        .close-btn:hover {
            color: var(--text-main);
        }

        .modal-content h3 {
            margin-top: 0;
            font-size: 1.5rem;
        }

        .contact-info {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
        }

        .contact-info a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 500;
        }
        
        .contact-info a:hover {
            text-decoration: underline;
        }

    </style>
</head>
